site_name: Doxide
site_description: Documentation and code coverage for modern C++. Configure with YAML, generate Markdown, publish with Material for MkDocs.
site_url: https://indii.org/software/doxide
repo_url: https://github.com/lawmurray/doxide
repo_name: lawmurray/doxide
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo_white.svg
  favicon: assets/logo_red.svg
  features:
    - navigation.indexes
    - navigation.footer
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: red
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: red
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: material/github

markdown_extensions:
  - def_list
  - attr_list
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true 
plugins:
  - search
  - social
extra_css:
  - stylesheets/doxide.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js
  - https://cdn.jsdelivr.net/npm/tablesort@5.7.1/src/tablesort.min.js
  - https://cdn.jsdelivr.net/npm/tablesort@5.7.1/src/sorts/tablesort.number.min.js
